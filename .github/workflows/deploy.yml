# Проверка и публикация сайта на хостинг Beget по FTP.
#
# Нужные секреты (GitHub → репозиторий → Settings → Secrets and variables → Actions):
#   FTP_SERVER      — адрес FTP-сервера Beget: <логин>.beget.tech
#   FTP_USERNAME    — логин FTP
#   FTP_PASSWORD    — пароль FTP
#   ADMIN_PASSWORD  — пароль для страницы /admin
# Необязательная переменная (вкладка Variables):
#   FTP_DIR — папка сайта относительно корня FTP-аккаунта (по умолчанию ./ —
#             FTP-аккаунт сразу смотрит в public_html сайта)
#
# Пока секретов нет, выполняется только проверка, публикация пропускается.

name: Проверка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Проверка api/daily.php (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 5.6 — версия по умолчанию на бесплатном Beget, 8.3 — современная
        php: ["5.6", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Запуск PHP ${{ matrix.php }}
        run: |
          php -r 'file_put_contents("api/config.php", "<?php return [\"password_hash\" => " . var_export(password_hash("test-pass", PASSWORD_DEFAULT), true) . "];\n");'
          docker run -d --name php -p 8080:8080 -v "$PWD:/app" -w /app php:${{ matrix.php }}-cli php -S 0.0.0.0:8080 -t /app
          sleep 3
          docker exec php php -v
          docker exec php php -l api/daily.php

      - name: Тест хранилища Ежедневника
        run: |
          set -e
          API=http://127.0.0.1:8080/api/daily.php
          code() { curl -s -o /tmp/out -w '%{http_code}' "$@"; }

          test "$(code $API)" = 200 && grep -q '{}' /tmp/out
          test "$(code -X POST -d '{"check":true}' $API)" = 401
          test "$(code -X POST -H 'X-Admin-Password: wrong' -d '{"check":true}' $API)" = 401
          test "$(code -X POST -H 'X-Admin-Password: test-pass' -d '{"check":true}' $API)" = 200
          test "$(code -X POST -H 'X-Admin-Password: test-pass' -d '{"key":"13-40","title":"x","text":"y"}' $API)" = 400
          test "$(code -X POST -H 'X-Admin-Password: test-pass' -d '{"key":"10-19","title":"Заголовок","text":"Текст","source":"Книга, с. 1"}' $API)" = 200
          test "$(code $API)" = 200 && grep -q 'Заголовок' /tmp/out
          test "$(code -X DELETE -H 'X-Admin-Password: test-pass' "$API?key=10-19")" = 200
          test "$(code $API)" = 200 && ! grep -q 'Заголовок' /tmp/out
          echo "Все проверки пройдены"

      - name: Лог сервера при ошибке
        if: failure()
        run: docker logs php || true

  deploy:
    name: Публикация на Beget
    needs: test
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Секреты не заданы — публикация пропущена
        if: env.FTP_SERVER == ''
        run: echo "Добавьте секреты FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, ADMIN_PASSWORD"

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Пароль админки
        if: env.FTP_SERVER != ''
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$ADMIN_PASSWORD" || { echo "Не задан секрет ADMIN_PASSWORD"; exit 1; }
          php -r 'file_put_contents("api/config.php", "<?php return [\"password_hash\" => " . var_export(password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT), true) . "];\n");'

      - name: Номер версии у CSS и JS (чтобы браузеры сразу брали свежие файлы)
        if: env.FTP_SERVER != ''
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"((assets/|data/)?[A-Za-z0-9_./-]+\.(css|js))\"#\1=\"\2?v=$V\"#g" index.html admin.html
          grep -oE '(href|src)="[^"]+\?v=[^"]+"' index.html admin.html

      - name: Загрузка по FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Beget принимает только зашифрованное соединение (FTPS), сертификат *.beget.tech
          protocol: ftps
          security: strict
          server-dir: ${{ vars.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            netlify/**
            netlify.toml
            package.json
            backup/**
            tools/**
            README.md
            api/storage/*.json
